<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vietnamese Delights - Order</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-gray-100 min-h-screen text-gray-800 pb-32">
  <div id="root"></div>
  <script>
    window.addEventListener("error", function (event) {
      const root = document.getElementById("root");
      if (root && !root.innerHTML.trim()) {
        root.innerHTML = `
          <div style="max-width:640px;margin:40px auto;padding:24px;font-family:Arial,sans-serif;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.12)">
            <h1 style="font-size:24px;margin:0 0 12px">The order page could not load</h1>
            <p style="color:#555">Please check that the file is being opened as an HTML page and that JavaScript is enabled.</p>
          </div>`;
      }
    });
  </script>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    /* ============================================================
       STORE CONFIGURATION
       ------------------------------------------------------------
       This is the main area you will edit later.

       1. Put your WhatsApp number here.
       2. Put your PayNow details here.
       3. Add/change menu dates in MENU_SCHEDULE.
       4. Add pictures later by changing image: "" to a file path,
          e.g. image: "images/banh-mi-chicken.jpg"

       IMPORTANT:
       - orderOpens / orderCloses control when customers can order.
       - fulfilmentDate is the day customers receive/collect the food.
       - Times use Singapore time.
       ============================================================ */

    const STORE_CONFIG = {
      storeName: "Vietnamese Delights",
      whatsappNumber: "6591234567",
      paynowDetails: "PayNow UEN / Phone: +65 9123 4567 (Food Store Name)",
      currency: "$"
    };

    /*
      EXAMPLE SCHEDULE — CHANGE THESE DATES/TIMES TO YOUR REAL DATES.

      You can have as many menu periods as you want.

      Example:
      Banh Mi ordering: 10 Aug 9:00am → 14 Aug 11:59pm
      Fulfilment:        15 Aug

      Bowls ordering:    17 Aug 9:00am → 21 Aug 11:59pm
      Fulfilment:        22 Aug
    */
    const MENU_SCHEDULE = [
      {
        id: "banh-mi-aug-15",
        menuId: "banh-mi",
        orderOpens: "2026-08-10T09:00:00+08:00",
        orderCloses: "2026-08-14T23:59:00+08:00",
        fulfilmentDate: "2026-08-15",
      },
      {
        id: "bowls-aug-22",
        menuId: "bowls",
        orderOpens: "2026-08-17T09:00:00+08:00",
        orderCloses: "2026-08-21T23:59:00+08:00",
        fulfilmentDate: "2026-08-22",
      }
    ];

    /* ============================================================
       MENU DATA
       ============================================================ */

    const MENUS = {
      "banh-mi": {
        id: "banh-mi",
        title: "Banh Mi",
        emoji: "🥖",
        description: "Fresh Vietnamese baguettes with your choice of filling.",
        products: [
          {
            id: "banh-mi-chicken",
            name: "Banh Mi - Grilled Chicken",
            price: 8.00,
            note: "Contains pork pate & pickled vegs",
            image: ""
          },
          {
            id: "banh-mi-pork",
            name: "Banh Mi - Grilled Pork",
            price: 8.00,
            note: "Contains pork pate & pickled vegs",
            image: ""
          },
          {
            id: "banh-mi-meatball",
            name: "Banh Mi - Pork Meatball",
            price: 8.00,
            note: "Contains pork pate & pickled vegs",
            image: ""
          },
          {
            id: "banh-mi-duck",
            name: "Banh Mi - Smoked Duck",
            price: 8.00,
            note: "Contains pork pate & pickled vegs",
            image: ""
          },
          {
            id: "banh-mi-veg",
            name: "Banh Mi - Vegetarian",
            price: 5.50,
            note: "Eggs, vegetables, no pate, beancurd skin",
            image: ""
          },
          {
            id: "banh-mi-trad",
            name: "Banh Mi - Traditional",
            price: 8.00,
            note: "Braised pork, ham, pate, pickled vegetables",
            image: ""
          }
        ],
        addOns: [
          {
            id: "addon-meat",
            name: "Extra Meat",
            price: 2.00
          },
          {
            id: "addon-egg",
            name: "Egg",
            price: 1.00
          },
          {
            id: "addon-chilli",
            name: "Our Spicy Chilli",
            price: 8.00
          }
        ]
      },

      "bowls": {
        id: "bowls",
        title: "Bowls & Sides",
        emoji: "🍜",
        description: "Vietnamese noodles, rice dishes, spring rolls and sides.",
        products: [
          {
            id: "bun-pork",
            name: "Bun Thit Nuong - Vietnamese Dry Vermicelli (Pork)",
            price: 9.50,
            note: "⚠️ Contains peanuts & basil",
            image: ""
          },
          {
            id: "bun-chicken",
            name: "Bun Thit Nuong - Vietnamese Dry Vermicelli (Chicken)",
            price: 9.50,
            note: "⚠️ Contains peanuts & basil",
            image: ""
          },
          {
            id: "com-tam-chicken",
            name: "Com Tam - Vietnamese Grilled Chicken Rice",
            price: 9.50,
            image: ""
          },
          {
            id: "com-tam-pork",
            name: "Com Tam - Vietnamese Grilled Pork Rice",
            price: 9.50,
            image: ""
          },
          {
            id: "spring-pork",
            name: "Fried Spring Rolls - Pork (5 pcs)",
            price: 4.50,
            image: ""
          },
          {
            id: "spring-fresh",
            name: "Fresh Spring Rolls - Pork / Prawn (5 pcs)",
            price: 11.00,
            note: "⚠️ Contains basil",
            image: ""
          },
          {
            id: "addon-meat",
            name: "Extra Meat",
            price: 2.00,
            image: ""
          },
          {
            id: "addon-egg",
            name: "Extra Egg",
            price: 1.00,
            image: ""
          },
          {
            id: "addon-chilli",
            name: "Our Spicy Chilli Bottle",
            price: 8.00,
            image: ""
          }
        ],
        addOns: []
      }
    };

    /* ============================================================
       HELPERS
       ============================================================ */

    function getCurrentSchedule() {
      const now = new Date();

      // Prefer an actively open menu.
      const openMenu = MENU_SCHEDULE.find(schedule => {
        const opens = new Date(schedule.orderOpens);
        const closes = new Date(schedule.orderCloses);
        return now >= opens && now <= closes;
      });

      if (openMenu) {
        return { status: "open", schedule: openMenu };
      }

      // Otherwise show the next scheduled menu.
      const upcoming = MENU_SCHEDULE
        .filter(schedule => new Date(schedule.orderOpens) > now)
        .sort((a, b) => new Date(a.orderOpens) - new Date(b.orderOpens))[0];

      if (upcoming) {
        return { status: "upcoming", schedule: upcoming };
      }

      return { status: "closed", schedule: null };
    }

    function formatDateTime(value) {
      return new Intl.DateTimeFormat("en-SG", {
        dateStyle: "medium",
        timeStyle: "short",
        timeZone: "Asia/Singapore"
      }).format(new Date(value));
    }

    function formatDate(value) {
      return new Intl.DateTimeFormat("en-SG", {
        dateStyle: "full",
        timeZone: "Asia/Singapore"
      }).format(new Date(value + "T12:00:00+08:00"));
    }

    function money(value) {
      return `${STORE_CONFIG.currency}${value.toFixed(2)}`;
    }

    function getProduct(menu, productId) {
      return menu.products.find(product => product.id === productId);
    }

    /*
      A cart item is a CONFIGURED LINE.

      This is deliberate:
      - Chicken Banh Mi + Egg can be one line.
      - Chicken Banh Mi + Extra Pork can be another line.
      - Chicken + Pork mixed can be another line.
      - Customers can have several different configurations
        of the same base Banh Mi in one order.
    */

    function createLineId() {
      return `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function App() {
      const [scheduleInfo, setScheduleInfo] = useState(getCurrentSchedule());
      const [customerInfo, setCustomerInfo] = useState({
        name: "",
        phone: "",
        address: "",
        notes: ""
      });
      const [cart, setCart] = useState([]);
      const [customizingProduct, setCustomizingProduct] = useState(null);

      // Re-check the schedule every 30 seconds.
      useEffect(() => {
        const timer = setInterval(() => {
          setScheduleInfo(getCurrentSchedule());
        }, 30000);

        return () => clearInterval(timer);
      }, []);

      // Remember basic customer details on this device.
      useEffect(() => {
        try {
          const saved = localStorage.getItem("vietnameseDelightsCustomer");
          if (saved) {
            setCustomerInfo(JSON.parse(saved));
          }
        } catch (error) {
          console.warn("Could not restore customer details.", error);
        }
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem(
            "vietnameseDelightsCustomer",
            JSON.stringify(customerInfo)
          );
        } catch (error) {
          console.warn("Could not save customer details.", error);
        }
      }, [customerInfo]);

      const schedule = scheduleInfo.schedule;
      const menu = schedule ? MENUS[schedule.menuId] : null;
      const isOpen = scheduleInfo.status === "open";

      const totalAmount = useMemo(() => {
        return cart.reduce((sum, line) => sum + line.total, 0);
      }, [cart]);

      const totalItemsCount = useMemo(() => {
        return cart.reduce((sum, line) => sum + line.quantity, 0);
      }, [cart]);

      const addConfiguredItem = (product, options = {}) => {
        const basePrice = product.price;
        const proteinExtrasTotal = (options.proteinExtras || []).reduce(
          (sum, item) => sum + item.price,
          0
        );
        const addOnsTotal = (options.addOns || []).reduce(
          (sum, item) => sum + item.price,
          0
        );

        const unitPrice = basePrice + proteinExtrasTotal + addOnsTotal;

        const line = {
          lineId: createLineId(),
          productId: product.id,
          productName: product.name,
          basePrice,
          quantity: 1,
          proteinExtras: options.proteinExtras || [],
          addOns: options.addOns || [],
          unitPrice,
          total: unitPrice
        };

        setCart(prev => [...prev, line]);
        setCustomizingProduct(null);
      };

      const addSimpleItem = (product) => {
        addConfiguredItem(product);
      };

      const changeLineQuantity = (lineId, delta) => {
        setCart(prev =>
          prev
            .map(line => {
              if (line.lineId !== lineId) return line;

              const quantity = Math.max(0, line.quantity + delta);

              return {
                ...line,
                quantity,
                total: quantity * line.unitPrice
              };
            })
            .filter(line => line.quantity > 0)
        );
      };

      const removeLine = (lineId) => {
        setCart(prev => prev.filter(line => line.lineId !== lineId));
      };

      const handleWhatsAppSubmit = (e) => {
        e.preventDefault();

        if (!isOpen || !schedule || !menu) {
          alert("Ordering is currently closed.");
          return;
        }

        if (cart.length === 0) {
          alert("Please add at least one item.");
          return;
        }

        if (!customerInfo.name.trim() || !customerInfo.phone.trim()) {
          alert("Please enter your name and phone number.");
          return;
        }

        let orderText = `*NEW ORDER - ${menu.title.toUpperCase()}*\n\n`;
        orderText += `*Fulfilment Date:* ${formatDate(schedule.fulfilmentDate)}\n`;
        orderText += `*Customer:* ${customerInfo.name}\n`;
        orderText += `*Phone:* ${customerInfo.phone}\n`;
        orderText += `*Delivery / Pickup:* ${customerInfo.address || "N/A"}\n`;

        if (customerInfo.notes) {
          orderText += `*General Notes:* ${customerInfo.notes}\n`;
        }

        orderText += `\n*--- ORDER ITEMS ---*\n`;

        cart.forEach(line => {
          orderText += `• ${line.productName} x${line.quantity} - ${money(line.unitPrice * line.quantity)}\n`;

          if (line.proteinExtras.length) {
            orderText += `   Protein mix: ${line.proteinExtras.map(x => x.name).join(", ")}\n`;
          }

          if (line.addOns.length) {
            orderText += `   Add-ons: ${line.addOns.map(x => x.name).join(", ")}\n`;
          }
        });

        orderText += `\n*TOTAL:* ${money(totalAmount)}\n`;
        orderText += `*Payment via PayNow:* ${STORE_CONFIG.paynowDetails}\n`;

        const encodedText = encodeURIComponent(orderText);
        window.open(
          `https://wa.me/${STORE_CONFIG.whatsappNumber}?text=${encodedText}`,
          "_blank"
        );
      };

      if (!schedule) {
        return (
          <ClosedScreen
            scheduleInfo={scheduleInfo}
            onRefresh={() => setScheduleInfo(getCurrentSchedule())}
          />
        );
      }

      return (
        <>
          <div className="max-w-2xl mx-auto p-4 sm:p-6">
            <Header menu={menu} schedule={schedule} />

            {!isOpen && (
              <div className="mt-4 bg-amber-50 border border-amber-200 text-amber-900 rounded-lg p-4">
                <div className="font-bold">⏳ Ordering is not open yet</div>
                <div className="text-sm mt-1">
                  Orders open on {formatDateTime(schedule.orderOpens)}.
                </div>
              </div>
            )}

            <form onSubmit={handleWhatsAppSubmit} className="space-y-4 mt-4">
              <CustomerDetails
                customerInfo={customerInfo}
                setCustomerInfo={setCustomerInfo}
              />

              <MenuSection
                menu={menu}
                isOpen={isOpen}
                onAdd={addSimpleItem}
                onCustomize={setCustomizingProduct}
              />

              <div className="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
                <label className="block text-sm font-medium text-gray-600 mb-1">
                  General Remarks / Special Requests
                </label>
                <input
                  type="text"
                  value={customerInfo.notes}
                  onChange={(e) =>
                    setCustomerInfo({ ...customerInfo, notes: e.target.value })
                  }
                  className="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-emerald-500 outline-none"
                  placeholder="Less spicy, no peanuts, separate sauce, etc."
                />
              </div>
            </form>
          </div>

          <CartBar
            cart={cart}
            totalAmount={totalAmount}
            totalItemsCount={totalItemsCount}
            isOpen={isOpen}
            onChangeQuantity={changeLineQuantity}
            onRemove={removeLine}
            onSubmit={handleWhatsAppSubmit}
          />

          {customizingProduct && (
            <CustomizeModal
              product={customizingProduct}
              menu={menu}
              onClose={() => setCustomizingProduct(null)}
              onAdd={addConfiguredItem}
            />
          )}
        </>
      );
    }

    function Header({ menu, schedule }) {
      return (
        <div className="bg-emerald-700 text-white rounded-t-lg p-6 shadow-md border-t-8 border-emerald-900">
          <div className="text-4xl mb-2">{menu.emoji}</div>
          <h1 className="text-2xl font-bold">{menu.title}</h1>
          <p className="text-emerald-100 mt-1 text-sm">{menu.description}</p>

          <div className="mt-4 grid gap-2 sm:grid-cols-2">
            <div className="p-3 bg-emerald-800 rounded text-xs leading-relaxed">
              <strong>📅 Fulfilment</strong>
              <div className="mt-1">{formatDate(schedule.fulfilmentDate)}</div>
            </div>

            <div className="p-3 bg-emerald-800 rounded text-xs leading-relaxed">
              <strong>⏰ Orders close</strong>
              <div className="mt-1">{formatDateTime(schedule.orderCloses)}</div>
            </div>
          </div>

          <div className="mt-3 p-3 bg-emerald-800 rounded text-xs leading-relaxed">
            <strong>💳 PayNow Payment:</strong> Payment details will be included
            in your WhatsApp order.
          </div>
        </div>
      );
    }

    function CustomerDetails({ customerInfo, setCustomerInfo }) {
      return (
        <div className="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
          <h2 className="text-lg font-semibold mb-3 text-gray-700 border-b pb-2">
            Customer Details
          </h2>

          <div className="space-y-3">
            <div>
              <label className="block text-sm font-medium text-gray-600 mb-1">
                Full Name *
              </label>
              <input
                type="text"
                required
                value={customerInfo.name}
                onChange={(e) =>
                  setCustomerInfo({ ...customerInfo, name: e.target.value })
                }
                className="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-emerald-500 outline-none"
                placeholder="John Doe"
              />
            </div>

            <div>
              <label className="block text-sm font-medium text-gray-600 mb-1">
                Phone Number *
              </label>
              <input
                type="tel"
                required
                value={customerInfo.phone}
                onChange={(e) =>
                  setCustomerInfo({ ...customerInfo, phone: e.target.value })
                }
                className="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-emerald-500 outline-none"
                placeholder="9123 4567"
              />
            </div>

            <div>
              <label className="block text-sm font-medium text-gray-600 mb-1">
                Delivery Address / Pickup Note
              </label>
              <textarea
                rows="2"
                value={customerInfo.address}
                onChange={(e) =>
                  setCustomerInfo({ ...customerInfo, address: e.target.value })
                }
                className="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-emerald-500 outline-none"
                placeholder="Block/Street or Self-Pickup time"
              />
            </div>
          </div>
        </div>
      );
    }

    function MenuSection({ menu, isOpen, onAdd, onCustomize }) {
      const isBanhMi = menu.id === "banh-mi";

      return (
        <div className="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
          <div className="flex items-center justify-between gap-3 mb-4 border-b pb-2">
            <h2 className="text-lg font-semibold text-gray-700">
              {menu.title}
            </h2>
            {isBanhMi && (
              <span className="text-xs bg-emerald-50 text-emerald-700 px-2 py-1 rounded-full">
                Customise your Banh Mi
              </span>
            )}
          </div>

          <div className="space-y-3">
            {menu.products.map(product => (
              <ProductCard
                key={product.id}
                product={product}
                isOpen={isOpen}
                isBanhMi={isBanhMi}
                onAdd={onAdd}
                onCustomize={onCustomize}
              />
            ))}
          </div>
        </div>
      );
    }

    function ProductCard({ product, isOpen, isBanhMi, onAdd, onCustomize }) {
      return (
        <div className="border border-gray-100 rounded-lg overflow-hidden">
          <div className="flex gap-3 p-3">
            <div className="w-20 h-20 sm:w-24 sm:h-24 shrink-0 bg-gray-100 rounded-lg overflow-hidden flex items-center justify-center">
              {product.image ? (
                <img
                  src={product.image}
                  alt={product.name}
                  className="w-full h-full object-cover"
                />
              ) : (
                <div className="text-gray-400 text-xs text-center px-2">
                  📷 Add photo later
                </div>
              )}
            </div>

            <div className="flex-1 min-w-0">
              <div className="font-medium text-gray-800">{product.name}</div>

              {product.note && (
                <div className="text-xs text-amber-600 mt-1">
                  {product.note}
                </div>
              )}

              <div className="text-sm font-semibold text-emerald-700 mt-2">
                {money(product.price)}
              </div>

              {isOpen && (
                <div className="mt-2 flex gap-2">
                  {isBanhMi ? (
                    <button
                      type="button"
                      onClick={() => onCustomize(product)}
                      className="px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold"
                    >
                      Customise & Add
                    </button>
                  ) : (
                    <button
                      type="button"
                      onClick={() => onAdd(product)}
                      className="px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold"
                    >
                      + Add
                    </button>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function CustomizeModal({ product, menu, onClose, onAdd }) {
      const [selectedProteins, setSelectedProteins] = useState([]);
      const [selectedAddOns, setSelectedAddOns] = useState([]);

      const proteinOptions = [
        { id: "pork", name: "Grilled Pork", price: 0 },
        { id: "chicken", name: "Grilled Chicken", price: 0 },
        { id: "meatball", name: "Pork Meatball", price: 0 },
        { id: "duck", name: "Smoked Duck", price: 0 }
      ];

      const toggleProtein = (protein) => {
        setSelectedProteins(prev => {
          const exists = prev.some(x => x.id === protein.id);

          if (exists) {
            return prev.filter(x => x.id !== protein.id);
          }

          return [...prev, protein];
        });
      };

      const toggleAddOn = (addOn) => {
        setSelectedAddOns(prev => {
          const exists = prev.some(x => x.id === addOn.id);

          if (exists) {
            return prev.filter(x => x.id !== addOn.id);
          }

          return [...prev, addOn];
        });
      };

      const extraPrice =
        selectedProteins.reduce((sum, item) => sum + item.price, 0) +
        selectedAddOns.reduce((sum, item) => sum + item.price, 0);

      const finalPrice = product.price + extraPrice;

      return (
        <div className="fixed inset-0 z-[100] bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-white w-full sm:max-w-lg sm:rounded-xl max-h-[90vh] overflow-y-auto shadow-2xl">
            <div className="p-5 border-b flex items-start justify-between gap-4">
              <div>
                <h3 className="text-xl font-bold text-gray-800">
                  Customise Banh Mi
                </h3>
                <p className="text-sm text-gray-500 mt-1">{product.name}</p>
              </div>

              <button
                type="button"
                onClick={onClose}
                className="w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 font-bold"
              >
                ×
              </button>
            </div>

            <div className="p-5 space-y-6">
              <div>
                <div className="font-semibold text-gray-800 mb-2">
                  Protein mix
                </div>

                <p className="text-xs text-gray-500 mb-3">
                  Select another protein if you want a mixed Banh Mi, e.g.
                  Chicken + Pork.
                </p>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  {proteinOptions.map(protein => {
                    const selected = selectedProteins.some(
                      x => x.id === protein.id
                    );

                    return (
                      <button
                        type="button"
                        key={protein.id}
                        onClick={() => toggleProtein(protein)}
                        className={`text-left p-3 rounded-lg border ${
                          selected
                            ? "border-emerald-500 bg-emerald-50"
                            : "border-gray-200 bg-white"
                        }`}
                      >
                        <div className="font-medium text-sm">
                          {selected ? "✓ " : ""}
                          {protein.name}
                        </div>
                        <div className="text-xs text-gray-500">
                          No extra charge
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              <div>
                <div className="font-semibold text-gray-800 mb-2">
                  Add-ons
                </div>

                <div className="space-y-2">
                  {menu.addOns.map(addOn => {
                    const selected = selectedAddOns.some(
                      x => x.id === addOn.id
                    );

                    return (
                      <button
                        type="button"
                        key={addOn.id}
                        onClick={() => toggleAddOn(addOn)}
                        className={`w-full flex items-center justify-between p-3 rounded-lg border text-left ${
                          selected
                            ? "border-emerald-500 bg-emerald-50"
                            : "border-gray-200 bg-white"
                        }`}
                      >
                        <span className="font-medium text-sm">
                          {selected ? "✓ " : ""}
                          {addOn.name}
                        </span>
                        <span className="text-sm font-semibold">
                          +{money(addOn.price)}
                        </span>
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="bg-gray-50 rounded-lg p-4">
                <div className="flex justify-between">
                  <span>{product.name}</span>
                  <span>{money(product.price)}</span>
                </div>

                {selectedProteins.length > 0 && (
                  <div className="text-sm text-gray-600 mt-2">
                    Protein mix:{" "}
                    {selectedProteins.map(x => x.name).join(" + ")}
                  </div>
                )}

                {selectedAddOns.length > 0 && (
                  <div className="text-sm text-gray-600 mt-1">
                    Add-ons:{" "}
                    {selectedAddOns.map(x => x.name).join(", ")}
                  </div>
                )}

                <div className="border-t mt-3 pt-3 flex justify-between font-bold">
                  <span>Total</span>
                  <span className="text-emerald-700">
                    {money(finalPrice)}
                  </span>
                </div>
              </div>

              <button
                type="button"
                onClick={() =>
                  onAdd(product, {
                    proteinExtras: selectedProteins,
                    addOns: selectedAddOns
                  })
                }
                className="w-full py-3 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold"
              >
                Add to Order — {money(finalPrice)}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function CartBar({
      cart,
      totalAmount,
      totalItemsCount,
      isOpen,
      onChangeQuantity,
      onRemove,
      onSubmit
    }) {
      const [expanded, setExpanded] = useState(false);

      return (
        <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-300 shadow-lg z-50">
          {expanded && cart.length > 0 && (
            <div className="max-w-2xl mx-auto max-h-72 overflow-y-auto p-4 border-b bg-gray-50">
              <div className="font-semibold mb-3">Your Order</div>

              <div className="space-y-3">
                {cart.map(line => (
                  <div
                    key={line.lineId}
                    className="bg-white border rounded-lg p-3"
                  >
                    <div className="flex justify-between gap-3">
                      <div className="flex-1">
                        <div className="font-medium text-sm">
                          {line.productName}
                        </div>

                        {line.proteinExtras.length > 0 && (
                          <div className="text-xs text-gray-500 mt-1">
                            Protein:{" "}
                            {line.proteinExtras.map(x => x.name).join(" + ")}
                          </div>
                        )}

                        {line.addOns.length > 0 && (
                          <div className="text-xs text-gray-500 mt-1">
                            Add-ons:{" "}
                            {line.addOns.map(x => x.name).join(", ")}
                          </div>
                        )}

                        <div className="text-sm font-semibold text-emerald-700 mt-1">
                          {money(line.unitPrice)} each
                        </div>
                      </div>

                      <button
                        type="button"
                        onClick={() => onRemove(line.lineId)}
                        className="text-xs text-red-600 h-fit"
                      >
                        Remove
                      </button>
                    </div>

                    <div className="flex items-center justify-between mt-2">
                      <div className="flex items-center gap-2">
                        <button
                          type="button"
                          onClick={() => onChangeQuantity(line.lineId, -1)}
                          className="w-8 h-8 rounded-full bg-gray-200 font-bold"
                        >
                          −
                        </button>

                        <span className="w-6 text-center font-semibold">
                          {line.quantity}
                        </span>

                        <button
                          type="button"
                          onClick={() => onChangeQuantity(line.lineId, 1)}
                          className="w-8 h-8 rounded-full bg-emerald-600 text-white font-bold"
                        >
                          +
                        </button>
                      </div>

                      <div className="font-bold">
                        {money(line.total)}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div className="max-w-2xl mx-auto p-3 sm:p-4 flex items-center justify-between gap-3">
            <button
              type="button"
              onClick={() => setExpanded(!expanded)}
              className="text-left min-w-0"
            >
              <div className="text-xs text-gray-500">
                {totalItemsCount} item(s) selected
              </div>
              <div className="text-xl font-bold text-emerald-800">
                {money(totalAmount)}
              </div>
              <div className="text-xs text-emerald-700 underline">
                {cart.length ? (expanded ? "Hide order" : "Review order") : ""}
              </div>
            </button>

            <button
              type="button"
              onClick={onSubmit}
              disabled={!isOpen || totalAmount === 0}
              className={`px-5 py-3 rounded-lg font-bold text-white shadow transition ${
                isOpen && totalAmount > 0
                  ? "bg-emerald-600 hover:bg-emerald-700"
                  : "bg-gray-300 cursor-not-allowed"
              }`}
            >
              {isOpen ? "Order via WhatsApp" : "Ordering Closed"}
            </button>
          </div>
        </div>
      );
    }

    function ClosedScreen({ scheduleInfo, onRefresh }) {
      const upcoming = scheduleInfo.schedule;

      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="max-w-lg w-full bg-white rounded-xl shadow-md p-8 text-center">
            <div className="text-5xl mb-4">🔒</div>

            <h1 className="text-2xl font-bold text-gray-800">
              Ordering is currently closed
            </h1>

            <p className="text-gray-600 mt-3">
              There are no scheduled menus available at the moment.
            </p>

            {upcoming && (
              <div className="mt-6 bg-emerald-50 border border-emerald-100 rounded-lg p-4 text-left">
                <div className="font-bold text-emerald-800">
                  Next: {MENUS[upcoming.menuId].emoji}{" "}
                  {MENUS[upcoming.menuId].title}
                </div>

                <div className="text-sm text-gray-600 mt-2">
                  Orders open: {formatDateTime(upcoming.orderOpens)}
                </div>

                <div className="text-sm text-gray-600">
                  Fulfilment: {formatDate(upcoming.fulfilmentDate)}
                </div>
              </div>
            )}

            <button
              type="button"
              onClick={onRefresh}
              className="mt-6 px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-semibold"
            >
              Check Again
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
