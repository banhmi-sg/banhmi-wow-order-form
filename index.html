<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banh Mi Order Form</title>
  <style>
    :root {
      --primary: #d97706;
      --primary-hover: #b45309;
      --bg: #fdfbf7;
      --card-bg: #ffffff;
      --text: #1f2937;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px 12px; }
    .container { max-width: 600px; margin: 0 auto; }
    
    .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid var(--border); }
    h1, h2, h3 { margin-top: 0; color: #111827; }
    
    .hero-box { background: #fef3c7; border-left: 4px solid var(--primary); padding: 12px 16px; border-radius: 6px; font-size: 0.9em; margin-top: 10px; }
    
    .field { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9em; }
    input[type="text"], input[type="tel"], textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
    
    .radio-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .radio-option { border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; align-items: center; gap: 8px; cursor: pointer; background: #fafafa; }
    .radio-option:has(input:checked) { border-color: var(--primary); background: #fffbeb; font-weight: bold; }
    
    .menu-item { border-bottom: 1px solid var(--border); padding: 12px 0; display: flex; justify-content: space-between; align-items: center; }
    .menu-item:last-child { border-bottom: none; }
    .btn-qty { background: #f3f4f6; border: 1px solid var(--border); border-radius: 6px; width: 32px; height: 32px; font-weight: bold; cursor: pointer; }
    .btn-qty:hover { background: #e5e7eb; }
    
    .pickup-info { background: #f3f4f6; padding: 10px; border-radius: 6px; font-size: 0.9em; }
    .btn-submit { width: 100%; background: #25d366; color: white; border: none; padding: 14px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-submit:hover { background: #1da851; }
  </style>
</head>
<body>

<div class="container" id="app"></div>

<script>
  // Configuration
  const STORE_CONFIG = {
    pickupLocation: "22 Upper Serangoon View",
    paynowDetails: "PayNow to Phone: +65 8123 6142 (Banh Mi Wow)",
    whatsappPhone: "6581236142",
    googleAppsScriptUrl: "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE" // Paste your Web App URL here
  };

  // State Management
  const state = {
    selectedDate: "Aug 21",
    deliveryTime: "12pm",
    fulfillmentType: "delivery",
    customer: { name: "", phone: "", address: "" },
    cart: {
      "Bun Thit Nuong (Pork)": { price: 9.50, qty: 0 },
      "Bun Thit Nuong (Chicken)": { price: 9.50, qty: 0 },
      "Com Tam (Pork Rice)": { price: 11.50, qty: 0 },
      "Cha Gio (Fried Spring Rolls)": { price: 4.50, qty: 0 },
      "Goi Cuon (Summer Rolls)": { price: 11.00, qty: 0 },
      "Spicy Chilli Bottle": { price: 8.00, qty: 0 }
    }
  };

  function esc(str) {
    return (str || "").replace(/"/g, "&quot;");
  }

  function render() {
    const app = document.getElementById('app');
    
    let subtotal = 0;
    Object.values(state.cart).forEach(item => subtotal += (item.price * item.qty));

    app.innerHTML = `
      <div class="card">
        <h1>🥖 Banh Mi Wow Order Form</h1>
        <div class="hero-box">
          <strong>💳 Payment via PayNow</strong><br>
          Orders are confirmed upon receipt of payment.
        </div>
      </div>

      ${customerForm()}

      <div class="card">
        <h2>Select Items</h2>
        ${Object.keys(state.cart).map(itemName => {
          const item = state.cart[itemName];
          return `
            <div class="menu-item">
              <div>
                <strong>${itemName}</strong><br>
                <small>$${item.price.toFixed(2)}</small>
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <button class="btn-qty" onclick="updateQty('${itemName}', -1)">-</button>
                <span><strong>${item.qty}</strong></span>
                <button class="btn-qty" onclick="updateQty('${itemName}', 1)">+</button>
              </div>
            </div>
          `;
        }).join('')}
        
        <div style="margin-top: 20px; font-size: 1.2rem; text-align: right;">
          <strong>Total Amount: $${subtotal.toFixed(2)}</strong> ${state.fulfillmentType === 'delivery' ? '+ Delivery Fee' : ''}
        </div>
      </div>

      <button class="btn-submit" onclick="submitOrder()">
        Send Order via WhatsApp 🚀
      </button>
    `;

    bindEvents();
  }

  function customerForm() {
    return `
      <div class="card">
        <h2>Order & Fulfilment Details</h2>
        <div class="field">
          <label>Full Name *</label>
          <input id="name" required value="${esc(state.customer.name)}" placeholder="Your Name">
        </div>
        
        <div class="field">
          <label>Phone Number *</label>
          <input id="phone" type="tel" required value="${esc(state.customer.phone)}" placeholder="8123 6142">
        </div>
        
        <div class="field">
          <label>Preferred Date *</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="fulfilmentDate" value="Aug 21" ${state.selectedDate === 'Aug 21' ? 'checked' : ''}>
              <span>Friday, 21 Aug</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="fulfilmentDate" value="Aug 22" ${state.selectedDate === 'Aug 22' ? 'checked' : ''}>
              <span>Saturday, 22 Aug</span>
            </label>
          </div>
        </div>

        <div class="field">
          <label>Preferred Time Slot *</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="deliveryTime" value="12pm" ${state.deliveryTime === '12pm' ? 'checked' : ''}>
              <span>12:00 PM (Lunch)</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="deliveryTime" value="6pm" ${state.deliveryTime === '6pm' ? 'checked' : ''}>
              <span>6:00 PM (Dinner)</span>
            </label>
          </div>
        </div>

        <div class="field">
          <label>Fulfillment Method *</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="fulfillment" value="delivery" ${state.fulfillmentType === 'delivery' ? 'checked' : ''}>
              <span>Delivery</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="fulfillment" value="pickup" ${state.fulfillmentType === 'pickup' ? 'checked' : ''}>
              <span>Self-Collection</span>
            </label>
          </div>
        </div>

        <div class="field">
          ${state.fulfillmentType === 'delivery' ? `
            <label>Delivery Address *</label>
            <textarea id="address" rows="2" placeholder="Block/Street, Unit #, Postal Code">${esc(state.customer.address)}</textarea>
          ` : `
            <label>Collection Point</label>
            <div class="pickup-info">
              📍 <strong>Self-Collection Location:</strong> ${esc(STORE_CONFIG.pickupLocation)}
            </div>
          `}
        </div>
      </div>
    `;
  }

  function bindEvents() {
    const nameInput = document.getElementById('name');
    const phoneInput = document.getElementById('phone');
    const addressInput = document.getElementById('address');

    if (nameInput) nameInput.addEventListener('input', e => state.customer.name = e.target.value);
    if (phoneInput) phoneInput.addEventListener('input', e => state.customer.phone = e.target.value);
    if (addressInput) addressInput.addEventListener('input', e => state.customer.address = e.target.value);

    document.querySelectorAll('input[name="fulfilmentDate"]').forEach(radio => {
      radio.addEventListener('change', e => { state.selectedDate = e.target.value; render(); });
    });

    document.querySelectorAll('input[name="deliveryTime"]').forEach(radio => {
      radio.addEventListener('change', e => { state.deliveryTime = e.target.value; render(); });
    });

    document.querySelectorAll('input[name="fulfillment"]').forEach(radio => {
      radio.addEventListener('change', e => { state.fulfillmentType = e.target.value; render(); });
    });
  }

  function updateQty(itemName, change) {
    if (state.cart[itemName]) {
      state.cart[itemName].qty = Math.max(0, state.cart[itemName].qty + change);
      render();
    }
  }

  function submitOrder() {
    if (!state.customer.name.trim() || !state.customer.phone.trim()) {
      alert("Please fill in your Name and Phone Number.");
      return;
    }
    if (state.fulfillmentType === 'delivery' && !state.customer.address.trim()) {
      alert("Please provide a delivery address.");
      return;
    }

    let itemsSummary = [];
    let totalAmount = 0;

    Object.keys(state.cart).forEach(name => {
      const item = state.cart[name];
      if (item.qty > 0) {
        const lineCost = item.qty * item.price;
        totalAmount += lineCost;
        itemsSummary.push(`${name} x${item.qty} ($${lineCost.toFixed(2)})`);
      }
    });

    if (itemsSummary.length === 0) {
      alert("Please select at least one item.");
      return;
    }

    const dateLabel = state.selectedDate === "Aug 21" ? "Friday, 21 Aug" : "Saturday, 22 Aug";
    const timeLabel = `${dateLabel} @ ${state.deliveryTime === "12pm" ? "12:00 PM (Lunch)" : "6:00 PM (Dinner)"}`;
    const totalText = `$${totalAmount.toFixed(2)}${state.fulfillmentType === 'delivery' ? ' + Delivery' : ''}`;

    // 1. Send Data to Google Sheets via Apps Script Web App
    if (STORE_CONFIG.googleAppsScriptUrl && STORE_CONFIG.googleAppsScriptUrl !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE") {
      fetch(STORE_CONFIG.googleAppsScriptUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          menuTitle: "Bowls & Sides",
          deliveryTime: timeLabel,
          customerName: state.customer.name,
          customerPhone: state.customer.phone,
          customerAddress: state.fulfillmentType === 'delivery' ? state.customer.address : `Self-Collection (${STORE_CONFIG.pickupLocation})`,
          orderDetails: itemsSummary.join("\n"),
          totalAmount: totalText,
          customerNotes: ""
        })
      }).catch(err => console.error("Sheet sync error:", err));
    }

    // 2. Format WhatsApp Message
    let msg = `*NEW ORDER - BANH MI WOW*\n\n`;
    msg += `*Name:* ${state.customer.name}\n`;
    msg += `*Phone:* ${state.customer.phone}\n`;
    msg += `*Fulfilment:* ${state.fulfillmentType.toUpperCase()}\n`;
    msg += `*Date & Time:* ${timeLabel}\n`;
    if (state.fulfillmentType === 'delivery') {
      msg += `*Address:* ${state.customer.address}\n`;
    } else {
      msg += `*Collection Point:* ${STORE_CONFIG.pickupLocation}\n`;
    }
    
    msg += `\n*Order Summary:*\n` + itemsSummary.map(i => `• ${i}`).join('\n') + `\n\n`;
    msg += `*Total Amount:* ${totalText}\n\n`;
    msg += `*Payment via PayNow:* ${STORE_CONFIG.paynowDetails}\n`;
    msg += `⚠️ *Please note:* Orders will be confirmed upon receipt of payment.`;

    // 3. Redirect to WhatsApp
    const waUrl = `https://wa.me/${STORE_CONFIG.whatsappPhone}?text=${encodeURIComponent(msg)}`;
    window.open(waUrl, '_blank');
  }

  // Initial Render
  render();
</script>

</body>
</html>
