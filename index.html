<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banh Mi Wow - Order Form</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel to compile JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-28">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // =========================================================================
    // ⚙️ CONFIGURATION PARAMETERS
    // =========================================================================
    const BRAND_NAME = "Banh Mi Wow";
    const INSTAGRAM_HANDLE = "@banhmiwowsg";
    const WHATSAPP_NUMBER = "6581236142"; // Your WhatsApp Number (with country code)
    const PAYNOW_DETAILS = "PayNow Mobile: 81236142";

    // Store Schedule Settings
    const CLOSED_DAYS = [1]; // Days closed: 0 = Sunday, 1 = Monday, 2 = Tuesday, etc.
    const OPEN_HOUR_24 = 11;  // Opening time (e.g., 11 = 11:00 AM)
    const CLOSE_HOUR_24 = 20; // Closing time (e.g., 20 = 8:00 PM)

    // Emergency / Sold-out Override Toggle
    const IS_MANUALLY_CLOSED = false; // Set to true to close form immediately
    const MANUAL_CLOSED_REASON = "We are completely sold out for today! Thank you for your support.";

    // Menu Products
    const PRODUCTS = [
      { id: 'bm-chicken', name: '1. Grilled Chicken Banh Mi', price: 8.00, note: 'Contains pork pate & pickled vegs' },
      { id: 'bm-pork', name: '2. Grilled Pork Banh Mi', price: 8.00, note: 'Contains pork pate & pickled vegs' },
      { id: 'bm-meatball', name: '3. Pork Meatball Banh Mi', price: 8.00, note: 'Contains pork pate & pickled vegs' },
      { id: 'bm-duck', name: '4. Smoked Duck Banh Mi', price: 8.00, note: 'Contains pork pate & pickled vegs' },
      { id: 'bm-veg', name: '5. Vegetarian Banh Mi', price: 5.50, note: 'Eggs, vegetables, no pate, beancurd skin' },
      { id: 'bm-trad', name: '6. Traditional Banh Mi', price: 8.00, note: 'Braised pork, ham, pate, pickled vegetables' },
      { id: 'addon-meat', name: 'Add-on: Extra Meat', price: 2.00 },
      { id: 'addon-egg', name: 'Add-on: Extra Egg', price: 1.00 },
      { id: 'addon-chilli', name: 'Add-on: Our Spicy Chilli Bottle', price: 8.00 },
    ];

    // =========================================================================
    // 🚀 MAIN APPLICATION COMPONENT
    // =========================================================================
    function OrderForm() {
      const [customerInfo, setCustomerInfo] = useState({ 
        name: '', 
        phone: '', 
        fulfillmentType: 'Self Collection', // 'Self Collection' or 'Delivery'
        address: '', 
        notes: '' 
      });
      const [quantities, setQuantities] = useState({});
      const [hasPaid, setHasPaid] = useState(false);

      // Check Store Open/Closed Status
      const now = new Date();
      const currentDay = now.getDay();
      const currentHour = now.getHours();

      const isClosedDay = CLOSED_DAYS.includes(currentDay);
      const isOutsideHours = currentHour < OPEN_HOUR_24 || currentHour >= CLOSE_HOUR_24;
      const isStoreClosed = IS_MANUALLY_CLOSED || isClosedDay || isOutsideHours;

      const updateQuantity = (id, delta) => {
        setQuantities(prev => {
          const current = prev[id] || 0;
          const updated = Math.max(0, current + delta);
          if (updated === 0) {
            const copy = { ...prev };
            delete copy[id];
            return copy;
          }
          return { ...prev, [id]: updated };
        });
      };

      const calculateTotal = () => {
        return PRODUCTS.reduce((sum, item) => {
          return sum + (quantities[item.id] || 0) * item.price;
        }, 0);
      };

      const handleWhatsAppSubmit = (e) => {
        e.preventDefault();
        const selectedItems = PRODUCTS.filter(item => quantities[item.id] > 0);

        if (selectedItems.length === 0) {
          alert('Please select at least one item.');
          return;
        }

        if (!hasPaid) {
          alert('Please check the box confirming you will attach/send your PayNow receipt screenshot in the WhatsApp chat.');
          return;
        }

        let orderText = `*NEW ORDER - ${BRAND_NAME.toUpperCase()}*\n\n`;
        orderText += `*Customer Name:* ${customerInfo.name}\n`;
        orderText += `*Phone:* ${customerInfo.phone}\n`;
        orderText += `*Fulfillment Method:* ${customerInfo.fulfillmentType}\n`;
        if (customerInfo.fulfillmentType === 'Self Collection') {
          orderText += `*Pickup Location:* T22 Poolside\n`;
        } else {
          orderText += `*Delivery Address:* ${customerInfo.address || 'N/A'}\n`;
          orderText += `*(Note: Delivery fee S$15 onwards applies)*\n`;
        }
        if (customerInfo.notes) orderText += `*Special Requests:* ${customerInfo.notes}\n`;

        orderText += `\n*--- ORDER ITEMS ---*\n`;
        selectedItems.forEach(item => {
          const qty = quantities[item.id];
          const subtotal = (qty * item.price).toFixed(2);
          orderText += `• ${item.name} x${qty} ($${subtotal})\n`;
        });

        const total = calculateTotal().toFixed(2);
        orderText += `\n*FOOD TOTAL:* $${total}\n`;
        if (customerInfo.fulfillmentType === 'Delivery') {
          orderText += `*(Excludes S$15+ delivery fee to be quoted)*\n`;
        }
        orderText += `\n*PAYMENT DETAILS*\n`;
        orderText += `Paid via PayNow to: ${PAYNOW_DETAILS}\n`;
        orderText += `*Status:* Screenshot attached in chat below 📎\n`;

        const encodedText = encodeURIComponent(orderText);
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodedText}`, '_blank');
      };

      const totalAmount = calculateTotal();
      const totalItemsCount = Object.values(quantities).reduce((a, b) => a + b, 0);

      // --- STORE CLOSED VIEW ---
      if (isStoreClosed) {
        return (
          <div className="max-w-md mx-auto p-6 mt-12 text-center">
            <div className="bg-amber-50 border border-amber-300 text-amber-900 p-8 rounded-xl shadow-lg">
              <div className="text-4xl mb-3">🔴</div>
              <h2 className="text-2xl font-bold mb-1">{BRAND_NAME}</h2>
              <p className="text-xs text-amber-700 font-semibold mb-3">IG: {INSTAGRAM_HANDLE}</p>
              <p className="text-sm text-amber-800 mb-4">
                {IS_MANUALLY_CLOSED 
                  ? MANUAL_CLOSED_REASON 
                  : isClosedDay 
                  ? "We are closed today for weekly rest and prep." 
                  : `We are closed. Our operating hours are ${OPEN_HOUR_24}:00 AM to ${CLOSE_HOUR_24 % 12 || 12}:00 PM.`}
              </p>
              <div className="text-xs font-semibold bg-amber-100 p-3 rounded text-amber-800">
                Operating Days: Tue – Sun ({OPEN_HOUR_24}:00 AM – {CLOSE_HOUR_24 % 12 || 12}:00 PM)
              </div>
            </div>
          </div>
        );
      }

      // --- OPEN STORE VIEW ---
      return (
        <div className="max-w-2xl mx-auto p-4 sm:p-6">
          {/* Header */}
          <div className="bg-amber-800 text-white rounded-t-lg p-6 shadow-md border-t-8 border-amber-950">
            <div className="flex items-center justify-between">
              <h1 className="text-2xl sm:text-3xl font-extrabold flex items-center gap-2">
                🥖 {BRAND_NAME}
              </h1>
              <a 
                href={`https://instagram.com/${INSTAGRAM_HANDLE.replace('@','')}`} 
                target="_blank" 
                rel="noreferrer"
                className="text-xs bg-amber-900 hover:bg-amber-950 px-3 py-1.5 rounded-full border border-amber-600 font-medium tracking-wide text-amber-200"
              >
                IG: {INSTAGRAM_HANDLE}
              </a>
            </div>
            <p className="text-amber-100 mt-2 text-sm">Select items, confirm PayNow total, and submit via WhatsApp.</p>
          </div>

          <form onSubmit={handleWhatsAppSubmit} className="space-y-4 mt-4">
            {/* Customer Details Box */}
            <div className="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
              <h2 className="text-lg font-semibold mb-3 text-gray-700 border-b pb-2">1. Customer Details</h2>
              <div className="space-y-3">
                <div>
                  <label className="block text-sm font-medium text-gray-600 mb-1">Full Name *</label>
                  <input
                    type="text"
                    required
                    value={customerInfo.name}
                    onChange={(e) => setCustomerInfo({ ...customerInfo, name: e.target.value })}
                    className="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-amber-500 outline-none"
                    placeholder="e.g. Mr Banh Mi"
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-600 mb-1">Mobile Phone Number *</label>
                  <input
                    type="tel"
                    required
                    value={customerInfo.phone}
                    onChange={(e) => setCustomerInfo({ ...customerInfo, phone: e.target.value })}
                    className="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-amber-500 outline-none"
                    placeholder="e.g. 81236142"
                  />
                </div>

                {/* Fulfillment Type Selection */}
                <div>
                  <label className="block text-sm font-medium text-gray-600 mb-1">Collection / Delivery Option *</label>
                  <div className="grid grid-cols-2 gap-3 mt-1">
                    <button
                      type="button"
                      onClick={() => setCustomerInfo({ ...customerInfo, fulfillmentType: 'Self Collection' })}
                      className={`p-3 text-sm font-semibold rounded-lg border text-center transition ${
                        customerInfo.fulfillmentType === 'Self Collection'
                          ? 'bg-amber-50 border-amber-600 text-amber-900 ring-2 ring-amber-500'
                          : 'bg-gray-50 border-gray-300 text-gray-600 hover:bg-gray-100'
                      }`}
                    >
                      <div>📍 Self Collection</div>
                      <div className="text-xs font-normal text-amber-700 mt-0.5">T22 Poolside</div>
                    </button>

                    <button
                      type="button"
                      onClick={() => setCustomerInfo({ ...customerInfo, fulfillmentType: 'Delivery' })}
                      className={`p-3 text-sm font-semibold rounded-lg border text-center transition ${
                        customerInfo.fulfillmentType === 'Delivery'
                          ? 'bg-amber-50 border-amber-600 text-amber-900 ring-2 ring-amber-500'
                          : 'bg-gray-50 border-gray-300 text-gray-600 hover:bg-gray-100'
                      }`}
                    >
                      <div>🚗 Delivery</div>
                      <div className="text-xs font-normal text-amber-700 mt-0.5">S$15 onwards</div>
                    </button>
                  </div>
                </div>

                {/* Conditional Address Input */}
                {customerInfo.fulfillmentType === 'Delivery' && (
                  <div>
                    <label className="block text-sm font-medium text-gray-600 mb-1">Delivery Address *</label>
                    <textarea
                      rows="2"
                      required
                      value={customerInfo.address}
                      onChange={(e) => setCustomerInfo({ ...customerInfo, address: e.target.value })}
                      className="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-amber-500 outline-none"
                      placeholder="Enter full street address and postal code"
                    />
                    <p className="text-xs text-amber-700 mt-1">Note: Delivery fee is $15 onwards depending on location.</p>
                  </div>
                )}
              </div>
            </div>

            {/* Menu Items */}
            <div className="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
              <h2 className="text-lg font-semibold mb-3 text-gray-700 border-b pb-2">2. Select Your Banh Mi & Items</h2>
              <div className="divide-y divide-gray-100">
                {PRODUCTS.map(item => {
                  const qty = quantities[item.id] || 0;
                  return (
                    <div key={item.id} className="py-3 flex items-center justify-between gap-4">
                      <div className="flex-1">
                        <div className="font-medium text-gray-800">{item.name}</div>
                        {item.note && <div className="text-xs text-amber-600 mt-0.5">{item.note}</div>}
                        <div className="text-sm font-semibold text-amber-800 mt-1">${item.price.toFixed(2)}</div>
                      </div>

                      <div className="flex items-center gap-2">
                        {qty > 0 && (
                          <button
                            type="button"
                            onClick={() => updateQuantity(item.id, -1)}
                            className="w-8 h-8 rounded-full bg-gray-200 hover:bg-gray-300 flex items-center justify-center font-bold text-gray-700"
                          >
                            -
                          </button>
                        )}
                        <span className={`w-6 text-center font-semibold ${qty > 0 ? 'text-gray-800' : 'text-gray-400'}`}>
                          {qty}
                        </span>
                        <button
                          type="button"
                          onClick={() => updateQuantity(item.id, 1)}
                          className="w-8 h-8 rounded-full bg-amber-600 hover:bg-amber-700 text-white flex items-center justify-center font-bold shadow-sm"
                        >
                          +
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* PayNow Instructions Box */}
            <div className="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
              <h2 className="text-lg font-semibold mb-2 text-gray-700 border-b pb-2">3. Payment via PayNow</h2>
              <div className="bg-amber-50 border border-amber-200 rounded-lg p-4 mb-4">
                <div className="text-xs text-amber-800 uppercase tracking-wide font-bold">PayNow Mobile Number</div>
                <div className="text-2xl font-extrabold text-amber-900 mt-1">8123 6142</div>
                <div className="text-xs text-amber-700 mt-2">
                  1. Transfer total amount <strong>(${totalAmount.toFixed(2)})</strong> via PayNow to <strong>81236142</strong>.
                  <br />
                  2. Take a screenshot of the successful transfer.
                  <br />
                  3. Attach the screenshot in WhatsApp after clicking the button below.
                </div>
              </div>

              <label className="flex items-start gap-3 cursor-pointer">
                <input
                  type="checkbox"
                  required
                  checked={hasPaid}
                  onChange={(e) => setHasPaid(e.target.checked)}
                  className="mt-1 h-5 w-5 text-amber-600 rounded border-gray-300 focus:ring-amber-500"
                />
                <span className="text-sm text-gray-700 leading-snug">
                  I confirm that I will attach the <strong>PayNow payment screenshot</strong> in the WhatsApp chat to confirm my order.
                </span>
              </label>
            </div>

            {/* Special Request */}
            <div className="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
              <label className="block text-sm font-medium text-gray-600 mb-1">Remarks / Special Requests</label>
              <input
                type="text"
                value={customerInfo.notes}
                onChange={(e) => setCustomerInfo({ ...customerInfo, notes: e.target.value })}
                className="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-amber-500 outline-none"
                placeholder="e.g. Less chilli, no peanuts, extra pate"
              />
            </div>

            {/* Bottom Sticky Bar */}
            <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-300 p-4 shadow-lg z-50">
              <div className="max-w-2xl mx-auto flex items-center justify-between">
                <div>
                  <div className="text-xs text-gray-500">{totalItemsCount} item(s) selected</div>
                  <div className="text-xl font-bold text-amber-900">${totalAmount.toFixed(2)}</div>
                </div>
                <button
                  type="submit"
                  disabled={totalAmount === 0 || !hasPaid}
                  className={`px-6 py-3 rounded-lg font-bold text-white flex items-center gap-2 shadow transition ${
                    totalAmount > 0 && hasPaid
                      ? 'bg-amber-600 hover:bg-amber-700 cursor-pointer' 
                      : 'bg-gray-300 cursor-not-allowed'
                  }`}
                >
                  <span>Submit Order & Receipt</span>
                </button>
              </div>
            </div>
          </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<OrderForm />);
  </script>
</body>
</html>
